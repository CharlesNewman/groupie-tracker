<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Groupie Tracker</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <div class="site-logo">
            <a href="/" class="site-logo">
                <img src="/static/logo.png" alt="Groupie Tracker logo">
                <h1>Groupie Tracker</h1>
            </a>
        </div>

        <div class="navigation-buttons">
            <nav>
                <a href="/about">About</a>
            </nav>
        </div>

        <form class="header-search" action="/search" method="GET">
            <input type="text" name="query" placeholder="Search artists...">
            <button type="submit">Search</button>
            <div class="search-suggestions"></div>
        </form>

        <button id="darkModeButton" type="button" aria-label="Toggle dark mode">
            ⏾
        </button>
    </header>

    <main>
        <div class="artist-grid">
            {{range .Artists}}
            <section class="artist-card">
                <h2>{{.Name}}</h2>

                <img src="{{.Image}}" alt="{{.Name}}">


                <button class="view-details-button" data-artist-id="{{.ID}}" type="button">View Details</button>
            </section>
            {{end}}
        </div>
    </main>

    <aside class="artist-panel">
        <button class="close-panel" type="button">×</button>

        <div class="panel-header">
            <img src="" alt="Artist image" class="panel-image">

            <div>
                <h2 class="panel-name">Artist Name</h2>
                <p class="panel-info">Artist information</p>
            </div>
        </div>
        <details>
            <summary>Members</summary>
            <div class="panel-members"></div>
        </details>

        <details>
            <summary>Concert Dates</summary>
            <div class="panel-concerts"></div>
        </details>
    </aside>

    <div class="pagination">
        {{if .HasPrevious}}
        <a href="/?page={{.PreviousPage}}">Previous</a>
        {{end}}

        <span>Page {{.CurrentPage}}</span>

        {{if .HasNext}}
        <a href="/?page={{.NextPage}}">Next</a>
        {{end}}
    </div>

    <script src="/static/darkmode.js"></script>
    <script src="/static/sidepanel.js"></script>
    <script src="/static/search.js"></script>
    <script src="/static/background.js"></script>

</body>

</html>
