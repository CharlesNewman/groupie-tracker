<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Groupie Tracker</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <h1>Groupie Tracker</h1>

        <div class="navigation-buttons">
            <nav>
                <a href="/">Home</a>
                <a href="/artists">Artists</a>
                <a href="/locations">Locations</a>
                <a href="/concerts">Concerts</a>
                <a href="/about">About</a>
            </nav>
        </div>

        <form class="header-search" action="/search" method="GET">
            <input type="text" name="query" placeholder="Search artists...">

            <button type="submit">Search</button>
        </form>

        <button id="darkModeButton" type="button" aria-label="Toggle dark mode">
            ⏾
        </button>
    </header>

    <main>
        <div class="artist-grid">
            {{range .}}
            <section class="artist-card">
                <h2>{{.Name}}</h2>

                <img src="{{.Image}}" alt="{{.Name}}">

                <p>Created: {{.CreationDate}}</p>
                <p>First album: {{.FirstAlbum}}</p>
                <button class="view-details-button" data-artist-id="{{.ID}}" type="button">View Details</button>
            </section>
            {{end}}
        </div>
    </main>

    <aside class="artist-panel">
        <button class="close-panel" type="button">×</button>

        <div class="panel-header">
            <img src="" alt="Artist image" class="panel-image">

            <div>
                <h2 class="panel-name">Artist Name</h2>
                <p class="panel-info">Artist information</p>
            </div>
        </div>
        <details>
                <summary>Members</summary>
                <div class="panel-members"></div>
        </details>

            <details>    
                <summary>Locations</summary>
                <div class="panel-locations"></div>
        </details>

        <details>
                <summary>Dates</summary>
                <div class="panel-concerts"></div>
        </details>
            </aside>

    <script src="/static/darkmode.js"></script>
    <script src="/static/sidepanel.js"></script>

</body>

</html>
